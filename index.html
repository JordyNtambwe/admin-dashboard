<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Admin-Dashbaord</title>
  </head>

  <body>
    <div class="container">
      <div class="header">
        <div class="header-content">
          <div class="search-bar">
            <img src="images/magnify.svg" alt="magnifying-scope" height="40" width="40">
            <form>
              <input type="text" name="search-bar" id="search-bar">
            </form>
          </div>
          <div class="account">
            <img class="bell" src="images/bell-ring-outline.svg" alt="bell-ringing" height="40" width="40">
            <img class="pac-man" src="images/pac-man.svg" alt="pac-man" height="100" width="100">
            <h1>Pac-Man</h1>
          </div>
        </div>
        <div class="header-content">
          <div class="greeting">
            <img class="pac-man" src="images/pac-man.svg" alt="pac-man" height="150" width="150">
            <h1><span>Hi there,</span> <br>Mr. Pac-Man (@pac-man)</h1>
          </div>
          <div class="list">
            <ul>
              <li><button class="new">New</button></li>
              <li><button class="upload">Upload</button></li>
              <li><button class="Share">Share</button></li>
            </ul>
          </div>
        </div>
      </div>
      <div class="side-bar">
        <div class="side-bar-content">
            <img src="images/view-dashboard.svg" alt="" height="100" width="100">
            <h1 class="dashboard">Dashboard</h1>
          </div>
        <div class="side-bar-content">
            <img src="images/home.svg" alt="home-png-icon" height="40" width="40">
            <h1 >Home</h1>
            <img src="images/card-account-details.svg" alt="id-png-icon" height="40" width="40">
            <h1>Profile</h1>
            <img src="images/message-reply.svg" alt="messages-png-icon" height="40" width="40">
            <h1>Messages</h1>
            <img src="images/clock-time-three.svg" alt="clock-png-icon" height="40" width="40">
            <h1>History</h1>
            <img src="images/file-multiple.svg" alt="multiple-files--png-icon" height="40" width="40">
            <h1>Tasks</h1>
            <img src="images/account-group.svg" alt="group-png-icon" height="40" width="40">
            <h1>Communities</h1>
        </div>
        <div class="side-bar-content">
            <img src="images/cog.svg" alt="gears-png-icon" height="40" width="40">
            <h1>Settings</h1>
            <img src="images/help-box.svg" alt="question-mark-png-icon" height="40" width="40">
            <h1>Support</h1>
            <img src="images/shield-check.svg" alt="checkmark-png-icon" height="40" width="40">
            <h1>Privacy</h1>
        </div>
      </div>
    </div>
  </body>

</html>
